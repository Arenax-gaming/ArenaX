[package]
name = "arenax-tournament-realtime"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
redis = { version = "0.32.6", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls", "uuid"] }
