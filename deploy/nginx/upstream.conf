# Rewritten by scripts/deploy/render-upstream.sh on every deploy/rollback,
# then loaded via `nginx -s reload` (graceful — in-flight requests finish
# on the old upstream, new requests go to the new one, zero downtime).
# This checked-in copy is the initial "blue is active, 100%" state.
upstream backend_upstream {
    server backend-blue:8080;
}

upstream frontend_upstream {
    server frontend-blue:3000;
}
