[workspace]
members = [
    "batch-operations",
    "arenax-events",
    "cross-contract-utils",
    "oracle-integration",
    "analytics",
    "game-state",
    "cross-game-assets",
    "example",
    "dispute-resolution",
    "protocol-params",
    "user_identity_contract",
    "reputation_aggregation",
    "match_contract",
    "match_escrow_vault",
    "match-lifecycle",
    "registry",
    "slashing_contract",
    "governance_multisig",
    "tournament_finalizer",
    "reputation-index",
    "contract-registry",
    "auth-gateway",
    "ax-token",
    "anti-cheat-oracle",
    "anti-cheat",
    "staking-manager",
    "staking-rewards",
    "upgrade-system",
    "player-reputation",
    "tournament-manager",
    "virtual-economy",
    "governance",
    "access-control",
    "emergency-pause",
    "time-lock",
    "zk-proof",
    "contract-standards",
    "contract-utils",
    "composable-example",
    "token-manager",
]
resolver = "2"

[workspace.dependencies]
soroban-sdk = "23.5.2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ArenaX Team <dev@arenax.gg>"]
license = "MIT"
repository = "https://github.com/arenax/arenax"
description = "ArenaX Stellar Smart Contracts"

[profile.release]
opt-level = "z"  # Optimize for size
lto = true       # Link-time optimization
codegen-units = 1
panic = "abort"

[workspace.lints.clippy]
too_many_arguments = "allow"
bool_assert_comparison = "allow"
needless_borrows_for_generic_args = "allow"
manual_range_contains = "allow"
let_and_return = "allow"
manual_abs_diff = "allow"
len_zero = "allow"
unnecessary_cast = "allow"
large_enum_variant = "allow"
manual_checked_ops = "allow"
new_without_default = "allow"
print_with_newline = "allow"

[workspace.lints.rust]
dead-code = "allow"
unused-imports = "allow"
unused-variables = "allow"
unused-mut = "allow"
deprecated = "allow"

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
