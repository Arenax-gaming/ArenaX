\* TLC configuration for VirtualEconomy.tla
\*
\* MaxReserve is deliberately tiny. The constant-product invariant is most
\* fragile at small reserves, where integer truncation is proportionally
\* largest -- exactly where a rounding-direction error shows up.

CONSTANTS
    MaxReserve = 8
    FeeBps = 30
    MinLiquidity = 1

INIT Init
NEXT Next

INVARIANT
    TypeOK
    ConstantProductNeverShrinks
    SharesMatchLiquidity
    MinimumLiquidityLocked
    NoOneSidedPool

PROPERTY
    LiquidityFloorHolds
