\* TLC configuration for AxToken.tla
\*
\* Small bounds on purpose: exhaustive checking is exponential, and the bugs
\* these invariants catch (supply desync, over-claim) appear at 2-3 accounts
\* if they appear at all. Larger models cost hours and find nothing new.

CONSTANTS
    Accounts = {a1, a2, a3}
    MaxSupply = 6
    Admin = a1

INIT Init
NEXT Next

INVARIANT
    TypeOK
    TotalSupplyIsSumOfBalances
    NoNegativeBalances
    SupplyWithinCap
    VestingNeverOverClaims

PROPERTY
    SupplyChangesOnlyViaMintOrBurn
