\* TLC configuration for StakingManager.tla
\*
\* PoolCoversAccruedRewards is the property worth the runtime: it is the
\* "last claimant gets nothing" bug, and it only appears under interleavings
\* where accrual races funding.

CONSTANTS
    Stakers = {s1, s2, s3}
    MaxStake = 4
    MaxPool = 6

INIT Init
NEXT Next

INVARIANT
    TypeOK
    TotalStakedIsConsistent
    PoolCoversAccruedRewards
    NoNegativeStake

PROPERTY
    AlwaysSolvent
